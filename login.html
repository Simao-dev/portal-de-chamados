<body>

  <div class="login-card" id="app">

    <div class="panel-left">
      <h1>Olá, Bem Vindo!</h1>
      <p>Ainda não tem conta ?</p>
      <button class="btn-register">Registre-se</button>
    </div>

    <div class="panel-right">
      <h2>Login</h2>

      <div id="area-login">

        <div class="form-group">
          <i class="fas fa-user input-icon"></i>
          <input id="matricula" type="text" name="matricula" class="form-control" placeholder="Usuário" required>

        <div class="form-group">
          <i class="fas fa-lock input-icon"></i>
          <input id="senha" type="password" name="senha" class="form-control" placeholder="Senha" required>
        </div>

        <button type="button" onclick="entrar()" class="btn-login">Entrar</button>
        <p style="color: var(--cor-fundoprincipal);" id="mensagem"></p>

      </div>
    </div>

  </div>

<script>
  /** Variáveis globais para gerenciar o estado da sessão do usuário logado */ 
  var nomeUsuarioLogado = window.nomeUsuarioLogado || "";
  var funcaoUsuarioLogado = window.funcaoUsuarioLogado || "";
  var nivelUsuarioLogado = window.nivelUsuarioLogado || "";

  /** CACHE GLOBAL EM MEMÓRIA DE TODAS AS ENTIDADES DO SISTEMA (OPTIMISTIC UI) */
  var listaChamadosGlobal = window.listaChamadosGlobal || [];
  var listaUsuariosGlobal = window.listaUsuariosGlobal || [];
  var listaTarefasGlobal = window.listaTarefasGlobal || [];
  var listaEquipamentosGlobal = window.listaEquipamentosGlobal || [];

  var autenticandoEmAndamento = false;

  /** FUNÇÃO DE AUTENTICAÇÃO E LOGIN */

  function entrar() {
    if (autenticandoEmAndamento) return;

    var elemMat = document.getElementById("matricula");
    var elemSen = document.getElementById("senha");
    var msg = document.getElementById("mensagem");

    var mat = elemMat ? elemMat.value.trim() : "";
    var sen = elemSen ? elemSen.value.trim() : "";

    if (!mat || !sen) {
      if (msg) {
        msg.style.color = "#ef4444";
        msg.innerText = "Preencha todos os campos.";
      }
      return;
    }

    autenticandoEmAndamento = true;
    if (msg) {
      msg.style.color = "#3b82f6";
      msg.innerText = "Autenticando...";
    }

    if (typeof google === "undefined" || !google.script || !google.script.run) {
      autenticandoEmAndamento = false;
      if (msg) {
        msg.style.color = "#ef4444";
        msg.innerText = "Erro: Conexão com o Google Apps Script não disponível.";
      }
      return;
    }

    google.script.run
      .withSuccessHandler(function(respostaPerfil) {
        if (respostaPerfil && respostaPerfil.nivel) {
          if (msg) {
            msg.style.color = "#10b981";
            msg.innerText = "Login aprovado! Carregando sistema...";
          }
          
          nivelUsuarioLogado = String(respostaPerfil.nivel).toLowerCase().trim();
          nomeUsuarioLogado = respostaPerfil.nomeCompleto || "Usuário";
          funcaoUsuarioLogado = respostaPerfil.funcao || "Geral";
          
          google.script.run
            .withSuccessHandler(function(htmlSistema) {
              autenticandoEmAndamento = false;
              if (htmlSistema) {
                document.body.innerHTML = htmlSistema;
              }
              
              setTimeout(function() {
                try {
                  if (document.getElementById("ncUsuarioLogado")) {
                    document.getElementById("ncUsuarioLogado").value = nomeUsuarioLogado;
                  }
                } catch(e) { console.error("Erro ao preencher usuario logado:", e); }

                try { configurarPermissoes(nivelUsuarioLogado); } catch(e) { console.error("Erro Permissoes:", e); }
                try { configurarNavegacao(); } catch(e) { console.error("Erro Navegacao:", e); }
                
                try { lerDadosDaTabela(); } catch(e) { console.error("Erro Tabela Geral:", e); }
                try { lerDadosDosUsuarios(); } catch(e) { console.error("Erro Tabela Users:", e); }
                try { preencherSelectSolicitante(); } catch(e) { console.error("Erro Select Solicitantes:", e); }
                try { inicializaPainel(); } catch(e) { console.error("Erro Painel Metricas:", e); }
                try { carregarEquipamentos(); } catch(e) { console.error("Erro Equipamentos:", e); }
                try { lerDadosDasTarefas(); } catch(e) { console.error("Erro Módulo Tarefas:", e); }
                
                setInterval(function() {
                  try { atualizarBadgeNotificacao(); } catch(e) {}
                }, 10000);
              }, 150);
            })
            .withFailureHandler(function(erroHtml) {
              autenticandoEmAndamento = false;
              if (msg) {
                msg.style.color = "#ef4444";
                msg.innerText = "Erro ao carregar tela do sistema: " + (erroHtml ? erroHtml.message : "Erro desconhecido");
              }
            })
            .carregarPaginaSistema();
            
        } else {
          autenticandoEmAndamento = false;
          if (msg) {
            msg.style.color = "#ef4444";
            msg.innerText = "Usuário ou senha inválidos.";
          }
        }
      })
      .withFailureHandler(function(erro) {
        autenticandoEmAndamento = false;
        if (msg) {
          msg.style.color = "#ef4444";
          msg.innerText = "Erro no servidor: " + (erro ? erro.message : "Resposta indefinida");
        }
      })
      .roteadorChamado({
        qualFuncao: "autenticarUsuario", 
        matricula: mat, 
        senha: sen
      });
  }

  window.entrar = entrar;
  if (typeof globalThis !== "undefined") {
    globalThis.entrar = entrar;
  }

  function inicializarEventosLogin() {
    var btnLogin = document.querySelector(".btn-login");
    if (btnLogin) {
      btnLogin.onclick = entrar;
    }
    var formLogin = document.getElementById("area-login");
    if (formLogin) {
      formLogin.onsubmit = function(e) {
        if (e && e.preventDefault) e.preventDefault();
        entrar();
        return false;
      };
    }
  }

  inicializarEventosLogin();
  if (typeof document !== "undefined") {
    if (document.readyState === "complete" || document.readyState === "interactive") {
      inicializarEventosLogin();
    } else {
      document.addEventListener("DOMContentLoaded", inicializarEventosLogin);
    }
  }

  /** NAVEGAÇÃO ENTRE MENUS */ 
  function configurarNavegacao() {
    const botoes = document.querySelectorAll(".menu-navegação");
    const telasFuncoes = document.querySelectorAll(".form-area");

    botoes.forEach(botao => {
      botao.addEventListener("click", function() {
        telasFuncoes.forEach(conteudo => {
          conteudo.classList.remove("conteudo-ativo");
        });
        botoes.forEach(b => b.classList.remove("active-nav"));

        const alvo = this.dataset.alvo;
        const conteudoParaMostrar = document.getElementById(alvo);

        if (conteudoParaMostrar) {
          conteudoParaMostrar.classList.add("conteudo-ativo");
          this.classList.add("active-nav");
        }
      });
    });

    let alvoPadrao = 'metricas';
    if (nivelUsuarioLogado === 'cliente') {
      alvoPadrao = 'chamados';
    }

    const abaPadrao = document.getElementById(alvoPadrao);
    const btnPadrao = document.querySelector(`[data-alvo="${alvoPadrao}"]`);
    
    if (abaPadrao && btnPadrao) {
      telasFuncoes.forEach(c => {
        if (c.classList.contains('form-area')) {
          c.classList.remove("conteudo-ativo");
        }
      });
      botoes.forEach(b => b.classList.remove("active-nav"));
      
      abaPadrao.classList.add('conteudo-ativo');
      btnPadrao.classList.add('active-nav');
    }
  }

  window.configurarNavegacao = configurarNavegacao;

  /** FUNÇÕES DE GERENCIAMENTO DE CHAMADOS E PORTAL DO CLIENTE (OPTIMISTIC UI) */

  function abrirModalNovoChamado() {
    try {
      const form = document.getElementById("formNovoChamado"); 
      if (form) form.reset();
      
      const inputNome = document.getElementById("ncUsuarioLogado");
      if (inputNome) {
        inputNome.value = nomeUsuarioLogado || "Usuário Conectado";
      }
      
      const modal = document.getElementById("novoChamadoModal");
      if (modal) { 
        modal.style.display = "flex"; 
        modal.classList.add("modal-open"); 
      }
    } catch(e) { 
      console.error("Erro ao abrir o modal de chamado do cliente:", e); 
    }
  }

  window.abrirModalNovoChamado = abrirModalNovoChamado;

  function salvarNovoChamado() {
    const descricaoText = document.getElementById("ncDescricao").value.trim();
    if (!descricaoText) { 
      mostrarAlerta("Por favor, descreva o que deseja no seu chamado."); 
      return; 
    }
    
    const agora = new Date();
    const horaStr = agora.toLocaleTimeString('pt-BR');
    const dataStr = agora.toLocaleDateString('pt-BR');
    
    const novoChamadoTemp = {
      id: "...",
      tipoDoChamado: "Requisição",
      solicitante: nomeUsuarioLogado,
      funcao: funcaoUsuarioLogado,
      statusChamado: "Pendente",
      descricao: descricaoText,
      informacaoExtra: "chamado aberto via portal",
      hora: horaStr,
      data: dataStr
    };

    listaChamadosGlobal.unshift(novoChamadoTemp);
    preencherTabelaNativaChamados(listaChamadosGlobal);
    lerChamadosDoClienteLogado();
    atualizarBadgeNotificacao();

    fecharModalNovoChamado(); 
    mostrarAlerta("Sucesso: Seu chamado foi registrado e enviado para análise técnica.");

    const dados = {
      qualFuncao: "entradaDeInformacoes", 
      idDoChamado: "", 
      tipoDoChamado: "Requisição",
      solicitante: nomeUsuarioLogado,
      funcao: funcaoUsuarioLogado, 
      statusChamado: "Pendente",
      descricao: descricaoText, 
      informacaoExtra: "chamado aberto via portal"
    };

    google.script.run
      .withSuccessHandler(function(resposta) { 
        if (resposta && resposta.status === "sucesso") {
          novoChamadoTemp.id = resposta.id;
          if (resposta.hora) novoChamadoTemp.hora = resposta.hora;
          if (resposta.data) novoChamadoTemp.data = resposta.data;
        }
        preencherTabelaNativaChamados(listaChamadosGlobal);
        lerChamadosDoClienteLogado();
      })
      .withFailureHandler(function(err) { 
        mostrarAlerta("Aviso: Houve um erro ao sincronizar com o servidor: " + err.message); 
      })
      .roteadorChamado(dados);
  }

  window.salvarNovoChamado = salvarNovoChamado;

  function fecharModalNovoChamado() {
    try {
      const modal = document.getElementById("novoChamadoModal");
      if (modal) { 
        modal.style.display = "none"; 
        modal.classList.remove("modal-open"); 
      }
    } catch(e) {
      console.error("Erro ao fechar modal de chamados:", e);
    }
  }

  window.fecharModalNovoChamado = fecharModalNovoChamado;

  function lerChamadosDoClienteLogado() {
    const tbody = document.getElementById("tabela-chamados-cliente-body"); 
    if (!tbody) return; 

    if (listaChamadosGlobal.length > 0) {
      filtrarERenderizarCliente();
      return;
    }

    google.script.run
      .withSuccessHandler(function(todosOsChamados) {
        if (Array.isArray(todosOsChamados)) {
          listaChamadosGlobal = todosOsChamados;
        }
        filtrarERenderizarCliente();
      })
      .withFailureHandler(function(err) {
        console.error("Erro ao puxar registros do cliente:", err);
      })
      .roteadorChamado({ qualFuncao: "lerChamados" });
  }

  window.lerChamadosDoClienteLogado = lerChamadosDoClienteLogado;

  function filtrarERenderizarCliente() {
    const chamadosFiltrados = listaChamadosGlobal.filter(function(chamado) {
      let solicitanteChamado = chamado.solicitante ? String(chamado.solicitante).trim().toLowerCase() : "";
      let usuarioLogadoLimpo = nomeUsuarioLogado ? String(nomeUsuarioLogado).trim().toLowerCase() : "";
      return solicitanteChamado === usuarioLogadoLimpo;
    });

    chamadosFiltrados.sort((a, b) => {
      if (a.statusChamado === "Pendente" && b.statusChamado !== "Pendente") return -1;
      if (a.statusChamado !== "Pendente" && b.statusChamado === "Pendente") return 1;
      return Number(b.id) - Number(a.id);
    });

    preencherTabelaCliente(chamadosFiltrados);
  }

  function preencherTabelaCliente(dados) {
    const tbody = document.getElementById("tabela-chamados-cliente-body"); 
    if (!tbody) return;
    tbody.innerHTML = "";

    if (!Array.isArray(dados) || dados.length === 0) { 
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 24px; color:var(--text-color-faded);">Você ainda não possui nenhum chamado registrado.</td></tr>`; 
      return; 
    }

    dados.forEach(item => {
      const tr = document.createElement("tr"); 
      tr.style.borderBottom = "1px solid var(--cor-linhas)";
      
      let corBg = item.statusChamado === 'Concluído' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(245, 158, 11, 0.1)';
      let corTexto = item.statusChamado === 'Concluído' ? 'var(--cor-acaopositiva)' : 'var(--cor-pendente)';

      tr.innerHTML = `
        <td style="padding: 12px 16px; font-family: monospace; color: var(--cor-primaria); font-weight:600;">#${item.id}</td>
        <td style="padding: 12px 16px;">${item.tipoDoChamado || "Requisição"}</td>
        <td style="padding: 12px 16px; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${item.descricao || ''}">${item.descricao || ""}</td>
        <td style="padding: 12px 16px;">${item.data || ""}</td>
        <td style="padding: 12px 16px;">${item.hora || ""}</td>
        <td style="padding: 12px 16px;">
          <span style="padding: 3px 8px; border-radius: 4px; font-size:11px; font-weight:600; background-color:${corBg}; color:${corTexto};">
            ${item.statusChamado || "Pendente"}
          </span>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function configurarPermissoes(nivel) {
    const botoesMenu = document.querySelectorAll(".menu-navegação");
    const areasConteudo = document.querySelectorAll(".form-area");
    const nivelAcesso = String(nivel).toLowerCase().trim();

    botoesMenu.forEach(btn => btn.style.display = '');

    if (nivelAcesso === 'cliente') {
      botoesMenu.forEach(btn => {
        const alvo = btn.dataset.alvo;
        if (alvo !== 'chamados' && alvo !== 'coleta-nfe-aba') {
          btn.style.setProperty('display', 'none', 'important');
        }
      });

      areasConteudo.forEach(aba => {
        if (aba.id !== 'chamados' && aba.id !== 'coleta-nfe-aba') {
          aba.classList.remove("conteudo-ativo");
        }
      });
    }

    if (document.getElementById('displayNivel')) {
      document.getElementById('displayNivel').innerText = nivelAcesso.toUpperCase();
    }
  }

  window.configurarPermissoes = configurarPermissoes;

  function fazerLogout() {
    var url = 'https://script.google.com/macros/s/AKfycbyEP_J2lPoXHFiCwMefE3vYA213dPv7kmkmh33SErR8Ahss4346sb3ZDARNOaxFcX_4Qw/exec';
    window.top.location.href = url;
  }

  window.fazerLogout = fazerLogout;

  /** MÓDULO DE MÉTRICAS */
  function inicializaPainel() {
    const inputData = document.getElementById("data-inicial");
    if (!inputData) return;

    flatpickr("#data-inicial", {
      mode: "range",
      dateFormat: "d/m/Y"
    });

    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, '0');
    const dia = String(hoje.getDate()).padStart(2, '0');
    const dataPadrao = `${ano}-${mes}-${dia}`;
    
    const dados = {
      qualFuncao: "metricas",
      dataInicial: dataPadrao,
      dataFinal: dataPadrao
    };

    if (document.getElementById("total-chamados")) document.getElementById("total-chamados").textContent = "...";
    if (document.getElementById("nome-solicitante")) document.getElementById("nome-solicitante").textContent = "...";
    if (document.getElementById("nome-tipo")) document.getElementById("nome-tipo").textContent = "...";

    google.script.run.withSuccessHandler(exibeMetricas).roteadorChamado(dados);
  }

  window.inicializaPainel = inicializaPainel;

  function exibeMetricas(resposta) {
    if (resposta && resposta.status === "erro") {
      mostrarAlerta(resposta.mensagem);
      return;
    }

    const elementoTotal = document.getElementById("total-chamados");
    if (!elementoTotal) return;

    const elementoPeriodo = document.getElementById("periodo-selecionado");
    const elementoPorcentagem = document.getElementById("porcentagem-chamados");
    const progressRingBarTotal = document.querySelector(".card1:nth-child(1) .progress-ring-bar");

    elementoTotal.textContent = resposta.total !== undefined ? resposta.total : 0;
    
    const dataInicialFormatada = formataDataParaExibicao(resposta.periodoInicial);
    const dataFinalFormatada = formataDataParaExibicao(resposta.periodoFinal);
    if (elementoPeriodo) elementoPeriodo.textContent = `${dataInicialFormatada} a ${dataFinalFormatada}`;
    
    const porcentagemTotal = parseFloat(resposta.porcentagem) || 0;
    if (elementoPorcentagem) elementoPorcentagem.textContent = `${porcentagemTotal.toFixed(1)}%`;
    if (progressRingBarTotal) progressRingBarTotal.style.setProperty('--percentage-total', porcentagemTotal);

    const elementoNomeSolicitante = document.getElementById("nome-solicitante");
    const elementoChamadosSolicitante = document.getElementById("chamados-solicitante");
    const elementoPorcentagemSolicitante = document.getElementById("porcentagem-solicitante");
    const progressRingBarSolicitante = document.querySelector(".card1:nth-child(2) .progress-ring-bar-solicitante");

    if (resposta.solicitanteMaisAtivo && resposta.chamadosDoMaisAtivo > 0) {
      if (elementoNomeSolicitante) elementoNomeSolicitante.textContent = resposta.solicitanteMaisAtivo;
      if (elementoChamadosSolicitante) elementoChamadosSolicitante.textContent = `${resposta.chamadosDoMaisAtivo} chamado(s)`;
      
      const porcentagemDoSolicitante = parseFloat(resposta.porcentagemSolicitante) || 0;
      if (elementoPorcentagemSolicitante) elementoPorcentagemSolicitante.textContent = `${porcentagemDoSolicitante.toFixed(1)}%`;
      if (progressRingBarSolicitante) progressRingBarSolicitante.style.setProperty('--percentage-solicitante', porcentagemDoSolicitante);
    } else {
      if (elementoNomeSolicitante) elementoNomeSolicitante.textContent = "N/A";
      if (elementoChamadosSolicitante) elementoChamadosSolicitante.textContent = "Nenhum chamado";
      if (elementoPorcentagemSolicitante) elementoPorcentagemSolicitante.textContent = "0%";
      if (progressRingBarSolicitante) progressRingBarSolicitante.style.setProperty('--percentage-solicitante', 0);
    }
    
    const elementoNomeTipo = document.getElementById("nome-tipo");
    const elementoChamadosDoTipo = document.getElementById("chamados-do-tipo");
    const elementoPorcentagemTipo = document.getElementById("porcentagem-tipo");
    const progressRingBarTipo = document.querySelector(".card1:nth-child(3) .progress-ring-bar-tipo");

    if (resposta.tipoMaisAtivo && resposta.chamadosDoTipoMaisAtivo > 0) {
      if (elementoNomeTipo) elementoNomeTipo.textContent = resposta.tipoMaisAtivo;
      if (elementoChamadosDoTipo) elementoChamadosDoTipo.textContent = `${resposta.chamadosDoTipoMaisAtivo} chamado(s)`;
      
      const porcentagemDoTipo = parseFloat(resposta.porcentagemTipo) || 0;
      if (elementoPorcentagemTipo) elementoPorcentagemTipo.textContent = `${porcentagemDoTipo.toFixed(1)}%`;
      if (progressRingBarTipo) progressRingBarTipo.style.setProperty('--percentage-tipo', porcentagemDoTipo);
    } else {
      if (elementoNomeTipo) elementoNomeTipo.textContent = "N/A";
      if (elementoChamadosDoTipo) elementoChamadosDoTipo.textContent = "Nenhum chamado";
      if (elementoPorcentagemTipo) elementoPorcentagemTipo.textContent = "0%";
      if (progressRingBarTipo) progressRingBarTipo.style.setProperty('--percentage-tipo', 0);
    }
  }

  function formataDataParaExibicao(dataString) {
    if(!dataString || !dataString.includes("-")) return "---";
    const partes = dataString.split("-");
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function enviaDatas() {
    const dataInicialInput = document.getElementById("data-inicial").value;
    if (!dataInicialInput) { mostrarAlerta("Por favor, selecione um intervalo de datas."); return; }
    
    const delimitador = dataInicialInput.includes(" to ") ? " to " : " a ";
    const datasArray = dataInicialInput.split(delimitador);
    const dataInicialFormatada = converteData(datasArray[0]);
    const dataFinalFormatada = datasArray[1] ? converteData(datasArray[1]) : dataInicialFormatada;

    mostrarLoading();
    google.script.run
        .withSuccessHandler(function(resposta) { esconderLoading(); exibeMetricas(resposta); }) 
        .roteadorChamado({ qualFuncao: "metricas", dataInicial: dataInicialFormatada, dataFinal: dataFinalFormatada });
  }

  window.enviaDatas = enviaDatas;

  function converteData(dataValor) {
    const partes = dataValor.trim().split("/");
    return `${partes[2]}-${partes[1]}-${partes[0]}`;
  }

  /** MÓDULO DE INTERAÇÃO DA TELA DE PESQUISA (ADMIN) */
  function pesquisarChamadoPorId() {
    const inputBusca = document.getElementById('buscarIdChamado');
    const idBusca = inputBusca ? inputBusca.value.trim() : "";
    
    if (!idBusca) {
      mostrarAlerta("Por favor, informe um ID válido para pesquisar.");
      return;
    }
    
    const chamadoLocal = listaChamadosGlobal.find(c => String(c.id).trim() === idBusca);
    if (chamadoLocal) {
      preencherFormularioPesquisa(chamadoLocal);
      return;
    }

    mostrarLoading();
    
    google.script.run
      .withSuccessHandler(function(resposta) {
        esconderLoading();
        
        if (resposta.status === "erro") {
          mostrarAlerta(resposta.mensagem);
          limparTelaPesquisa();
          return;
        }
        
        preencherFormularioPesquisa(resposta);
      })
      .withFailureHandler(function(erro) {
         esconderLoading();
         mostrarAlerta("Falha de comunicação: " + erro.message);
         limparTelaPesquisa();
      })
      .roteadorChamado({ 
        qualFuncao: "buscarUnicoChamado", 
        idChamado: idBusca 
      });
  }

  window.pesquisarChamadoPorId = pesquisarChamadoPorId;

  function preencherFormularioPesquisa(resposta) {
    document.getElementById('editIdChamado').value = resposta.id || "";
    document.getElementById('editTipoChamado').value = resposta.tipoDoChamado || "";
    document.getElementById('editStatusChamado').value = resposta.statusChamado || "";
    document.getElementById('editFuncaoChamado').value = resposta.funcao || "";
    document.getElementById('editDataChamado').value = resposta.data || "";
    document.getElementById('editHoraChamado').value = resposta.hora || "";
    document.getElementById('editDescricao').value = resposta.descricao || "";
    document.getElementById('editInformacaoExtra').value = resposta.informacaoExtra || "---";
    document.getElementById('editRepeticaoChamado').value = resposta.tipoRepeticao || "---";
    document.getElementById('editComandoChamado').value = resposta.comando || "";
    
    let solicitanteLimpo = resposta.solicitante ? String(resposta.solicitante).trim() : "";
    let funcaoLimpa = resposta.funcao ? String(resposta.funcao).trim() : "";
    const selectPesquisa = document.getElementById('editSolicitante');
    
    if (selectPesquisa) {
      if (solicitanteLimpo && funcaoLimpa && !solicitanteLimpo.includes(" - ")) {
        let valorChave = solicitanteLimpo + ' - ' + funcaoLimpa;
        selectPesquisa.value = valorChave;
        
        if (selectPesquisa.value !== valorChave) {
          let optNova = document.createElement('option');
          optNova.value = valorChave; 
          optNova.textContent = valorChave;
          selectPesquisa.appendChild(optNova);
          selectPesquisa.value = valorChave;
        }
      } else {
        selectPesquisa.value = solicitanteLimpo;
      }
    }
    
    const camposParaDestravar = [
      'editTipoChamado', 
      'editStatusChamado',

  function preencherTabelaNativaChamados(dados) {
    const tbody = document.getElementById("tabela-chamados-body");
    if (!tbody) return;
    tbody.innerHTML = "";

    if (!Array.isArray(dados) || dados.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:var(--text-color-faded);">Nenhum chamado registrado.</td></tr>`;
      return;
    }

    const dadosOrdenados = [...dados].sort((a, b) => {
      if (a.statusChamado === "Pendente" && b.statusChamado !== "Pendente") return -1;
      if (a.statusChamado !== "Pendente" && b.statusChamado === "Pendente") return 1;
      return Number(b.id) - Number(a.id);
    });

    dadosOrdenados.forEach(item => {
      const tr = document.createElement("tr");
      tr.dataset.chamadoRaw = JSON.stringify(item);
      
      tr.innerHTML = `
        <td style="font-family: monospace; color: var(--cor-primaria); font-weight: 600;">#${item.id}</td>
        <td>
          <span style="padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; 
            background-color: ${item.statusChamado === 'Concluído' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(245, 158, 11, 0.1)'}; 
            color: ${item.statusChamado === 'Concluído' ? 'var(--cor-acaopositiva)' : 'var(--cor-pendente)'};">
            ${item.statusChamado || ""}
          </span>
        </td>
        <td>${item.tipoDoChamado || ""}</td>
        <td style="color: var(--text-color-light); font-weight: 500;">${item.solicitante || ""}</td>
        <td>${item.funcao || ""}</td>
        <td>${item.descricao || ""}</td>
        <td>${item.informacaoExtra || ""}</td>
        <td>${item.hora || ""}</td>
        <td>${item.data || ""}</td>
      `;
      
      tr.addEventListener("click", function() {
        const data = JSON.parse(this.dataset.chamadoRaw);
        document.getElementById('idDoChamado').value = data.id;
        document.getElementById('tipoDoChamado').value = data.tipoDoChamado || "";
        document.getElementById('statusChamado').value = data.statusChamado || "";
        document.getElementById('descricao').value = data.descricao || "";
        document.getElementById('informacaoExtra').value = data.informacaoExtra || "";
        
        let solicitanteLimpo = data.solicitante ? String(data.solicitante).trim() : "";
        let funcaoLimpa = data.funcao ? String(data.funcao).trim() : "";
        const selectSolicitante = document.getElementById('solicitante');
        
        if (selectSolicitante) {
          if (solicitanteLimpo && funcaoLimpa && !solicitanteLimpo.includes(" - ")) {
            let valorCombinado = solicitanteLimpo + ' - ' + funcaoLimpa;
            selectSolicitante.value = valorCombinado;
            
            if (selectSolicitante.value !== valorCombinado) {
              let opt = document.createElement('option');
              opt.value = valorCombinado; 
              opt.textContent = valorCombinado;
              selectSolicitante.appendChild(opt);
              selectSolicitante.value = valorCombinado;
            }
          } else {
            selectSolicitante.value = solicitanteLimpo;
          }
        }
        
        document.getElementById('botaochamado').innerHTML = '<i class="bi bi-pencil-square"></i> Alterar Chamado';
      });

      tbody.appendChild(tr);
    });
  }

    try {

      const inputSenha = document.getElementById("userSenha");
      
      if (permissao === "admin" || permissao === "cliente") {
        if (containerSenha) containerSenha.style.display = ""; 
        if (inputSenha) inputSenha.required = true;
      } else {
        if (containerSenha) containerSenha.style.display = "none";

          inputSenha.required = false; 
        }
      }

      responsavel: respCurto, 
      solicitanteLogado: nomeUsuarioLogado,
      funcaoLogada: funcaoUsuarioLogado
    };

    google.script.run.withSuccessHandler(function(resposta) {
      if (resposta && resposta.id && itemTarget) {
        itemTarget.id = resposta.id;
      }
      preencherTabelaNativaTarefas(listaTarefasGlobal);
    }).roteadorChamado(dados);
  };

  window.lerDadosDasTarefas = function() {
    if (!document.getElementById("tabela-tarefas-body")) return;

    if (listaTarefasGlobal.length > 0) {
      preencherTabelaNativaTarefas(listaTarefasGlobal);
      return;
    }

    google.script.run
      .withSuccessHandler(function(resposta) {
        if (Array.isArray(resposta)) {
          listaTarefasGlobal = resposta;
        }
        preencherTabelaNativaTarefas(listaTarefasGlobal);
      })
      .roteadorChamado({ qualFuncao: "lerTarefas" });
  };

  window.preencherTabelaNativaTarefas = function(dados) {
    const tbody = document.getElementById("tabela-tarefas-body");
    if (!tbody) return;
    tbody.innerHTML = "";

    if (!Array.isArray(dados) || dados.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:var(--text-color-faded);">Nenhuma tarefa agendada.</td></tr>`;
      return;
    }

    dados.forEach(item => {
      let textoCel = String(item.descricao || "");
      let rotinaNome = "---";
      let comandoDiretriz = "---";
      let descricaoReal = textoCel;

      if (textoCel.includes(" // ")) {
        let partes = textoCel.split(" // ");
        if (partes.length >= 3) {
          rotinaNome = partes[0];
          comandoDiretriz = partes[1];
          descricaoReal = partes[2];
        } else {
          rotinaNome = partes[0];
          descricaoReal = partes[1];
        }
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="font-family: monospace; color: var(--cor-primaria); font-weight: 600;">#${item.id}</td>
        <td style="color: var(--text-color-light); font-weight: 500;">${rotinaNome}</td>
        <td style="color: var(--text-color-light);">${descricaoReal}</td>
        <td style="color: var(--text-color-faded); font-style: italic;">${comandoDiretriz}</td>
        <td>
          <span style="padding: 2px 6px; border-radius: 4px; font-size: 11px; background-color: rgba(139, 92, 246, 0.1); color: var(--cor-primaria);">
            ${item.tipoRepeticao || ""}
          </span>
        </td>
        <td>${item.data || ""}</td>
        <td>${item.hora || ""}</td>
        <td>${item.responsavel || ""}</td>
        <td>
          <button class="btn-table-edit" onclick="editarTarefaEspecifica('${item.id}')"><i class="bi bi-pencil"></i></button>
          <button class="btn-table-delete" onclick="deletarTarefaEspecifica('${item.id}')"><i class="bi bi-trash"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  };

  window.editarTarefaEspecifica = function(id) {
    const tarefaLocal = listaTarefasGlobal.find(t => String(t.id) === String(id));
    
    if (tarefaLocal) {
      abrirModalEdicaoTarefaObjeto(tarefaLocal);
      return;
    }

    mostrarLoading();
    google.script.run
      .withSuccessHandler(function(tarefa) {
        esconderLoading();
        if (!tarefa) { mostrarAlerta("Erro: Os dados desta tarefa não foram localizados."); return; }
        abrirModalEdicaoTarefaObjeto(tarefa);
      })
      .withFailureHandler(function() { esconderLoading(); })
      .roteadorChamado({ qualFuncao: "buscarUnicaTarefa", idTarefa: id });
  };

  function abrirModalEdicaoTarefaObjeto(tarefa) {
    document.getElementById("idTarefa").value = tarefa.id || "";
    document.getElementById("taskRotinaNome").value = tarefa.rotina || ""; 
    document.getElementById("taskDescricao").value = tarefa.descricao || "";
    document.getElementById("taskComando").value = tarefa.comando || ""; 
    document.getElementById("taskRepeticao").value = tarefa.tipoRepeticao || "Diaria";
    document.getElementById("taskHora").value = tarefa.hora || "";
    document.getElementById("taskModalTitle").textContent = "Editar Tarefa";

  function carregarEquipamentos() {
    const tbody = document.getElementById("tabela-equipamentos-body");

      renderizarTabelaEquipamentos(listaEquipamentosGlobal);
      return;

    if (typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (resposta) {
          listaEquipamentosGlobal = resposta || [];
          renderizarTabelaEquipamentos(listaEquipamentosGlobal);
        })
        .withFailureHandler(function (err) {
          if (tbody) tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--cor-acaoalerta);">Erro ao carregar dados.</td></tr>`;

  function renderizarTabelaEquipamentos(lista) {
    const tbody = document.getElementById("tabela-equipamentos-body");

    tbody.innerHTML = "";

    if (!lista || lista.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 20px; color: var(--text-color-faded);">Nenhum equipamento cadastrado.</td></tr>`;
      return;
    }

    lista.forEach((item) => {

      if (item.status === "Em Manutenção") classeStatus = "manutencao";
      if (item.status === "Inativo") classeStatus = "inativo";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>#${item.id}</strong></td>
        <td>${item.numero}</td>
        <td>${item.nome}</td>
        <td>${item.modelo}</td>
        <td>${item.tipo}</td>
        <td>${item.local}</td>
        <td><span class="status-badge ${classeStatus}">${item.status}</span></td>
        <td>${item.dataAdd}</td>
        <td>${item.obs || "-"}</td>
      `;
      tbody.appendChild(tr);
    });

    const nome = document.getElementById("cadNomeEq").value.trim();
    const modelo = document.getElementById("cadModeloEq").value.trim();
    const tipo = document.getElementById("cadTipoEq").value.trim();
    const local = document.getElementById("cadLocalEq").value.trim();
    const status = document.getElementById("cadStatusEq").value;
    const obs = document.getElementById("cadObsEq").value.trim();
    const dataHojeStr = new Date().toLocaleDateString('pt-BR');

    if (!num || !nome) {
      alert("Por favor, preencha os campos obrigatórios Número e Nome.");
      return;
    }

    const novoEquipamentoTemp = {
      id: "...",
      numero: num,
      nome: nome,
      modelo: modelo,
      tipo: tipo,
      local: local,
      status: status,
      dataAdd: dataHojeStr,
      obs: obs
    };

    listaEquipamentosGlobal.unshift(novoEquipamentoTemp);
    renderizarTabelaEquipamentos(listaEquipamentosGlobal);
    fecharModalCadastroEquipamento();

    const dadosEnvio = {
      qualFuncao: "salvarEquipamento",
      numero: num,
      nome: nome,
      modelo: modelo,
      tipo: tipo,
      local: local,
      status: status,
      obs: obs
    };

    if (typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (resposta) {
          if (resposta && resposta.id) {
            novoEquipamentoTemp.id = resposta.id;
            if (resposta.dataAdd) novoEquipamentoTemp.dataAdd = resposta.dataAdd;
            renderizarTabelaEquipamentos(listaEquipamentosGlobal);
          }
        })
        .roteadorChamado(dadosEnvio);
    }

  /** MÓDULO COLETA DE NFE */

  let listaItensNfeTemp = [];

  function adicionarItemNaListaNfe() {
    const inputCodigo = document.getElementById("nfeCodigoBarras");
    const inputQtd = document.getElementById("nfeQuantidade");

    const codigo = inputCodigo.value.trim();
    const quantidade = parseInt(inputQtd.value);

    if (!codigo) {
      alert("Por favor, digite o código de barras.");
      inputCodigo.focus();
      return;
    }

    if (isNaN(quantidade) || quantidade <= 0) {
      alert("Informe uma quantidade válida maior que zero.");
      inputQtd.focus();
      return;
    }

    const indexExistente = listaItensNfeTemp.findIndex(item => item.codigo === codigo);

    if (indexExistente !== -1) {
      listaItensNfeTemp[indexExistente].quantidade += quantidade;
    } else {
      listaItensNfeTemp.push({
        codigo: codigo,
        quantidade: quantidade
      });
    }

    inputCodigo.value = "";
    inputQtd.value = "1";
    inputCodigo.focus();

    renderizarTabelaNfeTemp();
  }

  window.adicionarItemNaListaNfe = adicionarItemNaListaNfe;

  function tratarTeclaEnterNfe(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      adicionarItemNaListaNfe();
    }
  }

  window.tratarTeclaEnterNfe = tratarTeclaEnterNfe;

    tbody.innerHTML = "";

            Nenhum item adicionado à lista.

    listaItensNfeTemp.forEach((item, index) => {

      tr.innerHTML = `

          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function alterarQtdNfeTemp(index, novaQtd) {
    const qtd = parseInt(novaQtd);
    if (!isNaN(qtd) && qtd > 0) {
      listaItensNfeTemp[index].quantidade = qtd;
    } else {
      renderizarTabelaNfeTemp();
    }
  }

  window.alterarQtdNfeTemp = alterarQtdNfeTemp;

  function removerItemNfeTemp(index) {

  }

  window.removerItemNfeTemp = removerItemNfeTemp;

  function limparTodaListaNfe() {
    if (listaItensNfeTemp.length === 0) return;
    if (confirm("Deseja realmente limpar todos os itens da lista?")) {
      listaItensNfeTemp = [];
      renderizarTabelaNfeTemp();
    }
  }

  window.limparTodaListaNfe = limparTodaListaNfe;

  function abrirModalSucessoNfe(mensagem) {
    if (mensagem) {
      const txt = document.getElementById("msgSucessoNfeTexto");
      if (txt) txt.textContent = mensagem;
    }
    const modal = document.getElementById("modalSucessoNfe");
    if (modal) { modal.style.display = "flex"; modal.classList.add("modal-open"); }
  }

  window.abrirModalSucessoNfe = abrirModalSucessoNfe;

  function fecharModalSucessoNfe() {
    const modal = document.getElementById("modalSucessoNfe");
    if (modal) { modal.style.display = "none"; modal.classList.remove("modal-open"); }
  }

  window.fecharModalSucessoNfe = fecharModalSucessoNfe;

  function solicitarConfirmacaoEnvioNfe() {
    if (listaItensNfeTemp.length === 0) {
      alert("Adicione pelo menos um item à lista antes de enviar.");
      return;
    }

    if (document.getElementById("confirmTotalItens")) document.getElementById("confirmTotalItens").textContent = listaItensNfeTemp.length;
    const modalConfirm = document.getElementById("modalConfirmarEnvioNfe");
    if (modalConfirm) { modalConfirm.style.display = "flex"; modalConfirm.classList.add("modal-open"); }
  }

  window.solicitarConfirmacaoEnvioNfe = solicitarConfirmacaoEnvioNfe;

  function fecharModalConfirmarEnvioNfe() {
    const modalConfirm = document.getElementById("modalConfirmarEnvioNfe");
    if (modalConfirm) { modalConfirm.style.display = "none"; modalConfirm.classList.remove("modal-open"); }
  }

  window.fecharModalConfirmarEnvioNfe = fecharModalConfirmarEnvioNfe;

  function enviarPedidoNfeFinal() {
    let usuarioLogado = "";

    if (typeof nomeUsuarioLogado !== "undefined" && nomeUsuarioLogado) {
      usuarioLogado = nomeUsuarioLogado;
    } else if (document.getElementById("ncUsuarioLogado") && document.getElementById("ncUsuarioLogado").value) {
      usuarioLogado = document.getElementById("ncUsuarioLogado").value;
    } else if (document.getElementById("solicitante") && document.getElementById("solicitante").value) {
      usuarioLogado = document.getElementById("solicitante").value;
    }

    const dadosEnvio = {
      qualFuncao: "processarPedidoNfe",
      solicitante: usuarioLogado || "Usuário do Portal",
      itens: listaItensNfeTemp
    };

    if (typeof google !== "undefined" && google.script && google.script.run) {
      if (typeof fecharModalConfirmarEnvioNfe === "function") fecharModalConfirmarEnvioNfe();

      google.script.run
        .withSuccessHandler(function (resposta) {
          if (resposta && resposta.status === "sucesso") {
            listaItensNfeTemp = [];
            renderizarTabelaNfeTemp();
            abrirModalSucessoNfe(resposta.mensagem);
          } else {
            abrirModalSucessoNfe("Aviso: " + (resposta.mensagem || "Erro ao processar envio."));
          }
        })
        .withFailureHandler(function (err) {
          abrirModalSucessoNfe("Erro de comunicação com o servidor: " + err);
        })
        .roteadorChamado(dadosEnvio);
    }
  }

  window.enviarPedidoNfeFinal = enviarPedidoNfeFinal;

</script>

<script>
  /** Variáveis globais para gerenciar o estado da sessão do usuário logado */ 
  let nomeUsuarioLogado = "";
  let funcaoUsuarioLogado = "";
  let nivelUsuarioLogado = "";

  /**FUNÇÃO DE AUTENTICAÇÃO E LOGIN */

  function entrar() {
    var mat = document.getElementById("matricula").value;
    var sen = document.getElementById("senha").value;
    var msg = document.getElementById("mensagem");

    if (!mat || !sen) {
      if (msg) msg.innerText = "Preencha todos os campos.";
      return;
    }

    if (msg) msg.innerText = "Autenticando...";

    google.script.run
      .withSuccessHandler(function(respostaPerfil) {

        /** Trata o retorno como objeto estruturado conforme o post.gs devolve */
        if (respostaPerfil && respostaPerfil.nivel) {
          if (msg) msg.innerText = "Login aprovado! Carregando sistema...";
          
          nivelUsuarioLogado = String(respostaPerfil.nivel).toLowerCase().trim();
          nomeUsuarioLogado = respostaPerfil.nomeCompleto;
          funcaoUsuarioLogado = respostaPerfil.funcao;
          
          google.script.run
            .withSuccessHandler(function(htmlSistema) {
              document.body.innerHTML = htmlSistema;
              
              /** Executa a inicialização de forma segura isolando os blocos por try/catch */ 
              setTimeout(function() {
                try { configurarPermissoes(nivelUsuarioLogado); } catch(e) { console.error("Erro Permissoes:", e); }
                try { configurarNavegacao(); } catch(e) { console.error("Erro Navegacao:", e); }
                
                /** Inicializações de tabelas puros com base nas permissões de escopo */ 
                try { lerDadosDaTabela(); } catch(e) { console.error("Erro Tabela Geral:", e); }
                try { lerDadosDosUsuarios(); } catch(e) { console.error("Erro Tabela Users:", e); }
                try { preencherSelectSolicitante(); } catch(e) { console.error("Erro Select Solicitantes:", e); }
                try { inicializaPainel(); } catch(e) { console.error("Erro Painel Metricas:", e); }
                try { atualizarBadgeNotificacao(); } catch(e) { console.error("Erro Badge:", e); }
                try { lerDadosDasTarefas(); } catch(e) { console.error("Erro Módulo Tarefas:", e); }
                
                /** INCLUSÃO DA ABA DE CHAMADOS (PORTAL DO CLIENTE) */
                try { lerChamadosDoClienteLogado(); } catch(e) { console.error("Erro Histórico Cliente:", e); }
                
                setInterval(function() {
                  try { atualizarBadgeNotificacao(); } catch(e) {}
                }, 10000);
              }, 150);
            })
            .carregarPaginaSistema();
            
        } else {
          if (msg) msg.innerText = "Usuário ou senha inválidos.";
        }
      })
      .withFailureHandler(function(erro) {
        if (msg) msg.innerText = "Erro: " + erro.message;
      })
      .roteadorChamado({
        qualFuncao: "autenticarUsuario", 
        matricula: mat, 
        senha: sen
      });
  }

  /** NAVEGAÇÃO ENTRE MENUS - DIRECIONAMENTO EXCLUSIVO BASEADO NA PERMISSÃO */ 
  function configurarNavegacao() {
    const botoes = document.querySelectorAll(".menu-navegação");
    const telasFuncoes = document.querySelectorAll(".form-area");

    botoes.forEach(botao => {
      botao.addEventListener("click", function() {
        telasFuncoes.forEach(conteudo => {
          conteudo.classList.remove("conteudo-ativo");
        });
        botoes.forEach(b => b.classList.remove("active-nav"));

        const alvo = this.dataset.alvo;
        const conteudoParaMostrar = document.getElementById(alvo);

        if (conteudoParaMostrar) {
          conteudoParaMostrar.classList.add("conteudo-ativo");
          this.classList.add("active-nav");
        }
      });
    });

    /**  Redirecionamento forçado de inicialização se for cliente */
    let alvoPadrao = 'metricas';
    if (nivelUsuarioLogado === 'cliente') {
      alvoPadrao = 'chamados';
    }

    const abaPadrao = document.getElementById(alvoPadrao);
    const btnPadrao = document.querySelector(`[data-alvo="${alvoPadrao}"]`);
    
    if (abaPadrao && btnPadrao) {
      telasFuncoes.forEach(c => {
        if (c.classList.contains('form-area')) {
          c.classList.remove("conteudo-ativo");
        }
      });
      botoes.forEach(b => b.classList.remove("active-nav"));
      
      abaPadrao.classList.add('conteudo-ativo');
      btnPadrao.classList.add('active-nav');
    }
  }

  /** FUNÇÃO DE HISTÓRICO E REQUISIÇÃO (PORTAL DO CLIENTE)*/
  
  /**FUNÇÃO PARA ABRIR O MODAL DE NOVO CHAMADO*/

  function abrirModalNovoChamado() {
    try {
      const form = document.getElementById("formNovoChamado"); 
      if (form) form.reset();
      
      /**  Localiza o campo de texto do modal e injeta o nome de quem está logado */
      const inputNome = document.getElementById("ncUsuarioLogado");
      if (inputNome) {
        inputNome.value = nomeUsuarioLogado || "Usuário Conectado";
      }
      
      const modal = document.getElementById("novoChamadoModal");
      if (modal) { 
        modal.style.display = "flex"; 
        modal.classList.add("modal-open"); 
      }
    } catch(e) { 
      console.error("Erro ao abrir o modal de chamado do cliente:", e); 
    }
  }

  /** FUNÇÃO PARA SALVAR O CHAMADO VINDO DO PORTAL */
  function salvarNovoChamado() {
    const descricaoText = document.getElementById("ncDescricao").value.trim();
    if (!descricaoText) { 
      mostrarAlerta("Por favor, descreva o que deseja no seu chamado."); 
      return; 
    }
    
    mostrarLoading();
    
    /** Monta o objeto estruturado respeitando as colunas da aba 'main' */ 
    const dados = {
      qualFuncao: "entradaDeInformacoes", 
      idDoChamado: "", 
      tipoDoChamado: "Requisição",
      solicitante: nomeUsuarioLogado,
      funcao: funcaoUsuarioLogado, 
      statusChamado: "Pendente",
      descricao: descricaoText, 
      informacaoExtra: "chamado aberto via portal"
    };

    google.script.run
      .withSuccessHandler(function(resposta) { 
        esconderLoading(); 
        fecharModalNovoChamado(); 
        mostrarAlerta("Sucesso: Seu chamado foi registrado e enviado para análise técnica."); 
        
        /** Atualiza os seletores de forma segura */ 
        try { lerDadosDaTabela(); } catch(e){} 
        try { atualizarBadgeNotificacao(); } catch(e){} 
        try { lerChamadosDoClienteLogado(); } catch(e){} 
      })
      .withFailureHandler(function(err) { 
        esconderLoading(); 
        mostrarAlerta("Erro ao registrar chamado: " + err.message); 
      })
      .roteadorChamado(dados);
  }

  /** FUNÇÃO FECHA MODAL NOVO CHAMADO CLIENTE */

  function fecharModalNovoChamado() {
    try {
      const modal = document.getElementById("novoChamadoModal");
      if (modal) { 
        modal.style.display = "none"; 
        modal.classList.remove("modal-open"); 
      }
    } catch(e) {
      console.error("Erro ao fechar modal de chamados:", e);
    }
  }

  /** FUNÇÃO QUE LÊ E FILTRA OS CHAMADOS EXCLUSIVOS DO CLIENTE LOGADO */ 
  function lerChamadosDoClienteLogado() {
    const tbody = document.getElementById("tabela-chamados-cliente-body"); 
    if (!tbody) return; 

    google.script.run
      .withSuccessHandler(function(todosOsChamados) {
        if (!Array.isArray(todosOsChamados)) return;
        
        /** Compara o solicitante da planilha com o nome do usuário logado na sessão */ 
        const chamadosFiltrados = todosOsChamados.filter(function(chamado) {
          let solicitanteChamado = chamado.solicitante ? String(chamado.solicitante).trim().toLowerCase() : "";
          let usuarioLogadoLimpo = nomeUsuarioLogado ? String(nomeUsuarioLogado).trim().toLowerCase() : "";
          return solicitanteChamado === usuarioLogadoLimpo;
        });

        /**Deixa os chamados "Pendentes" no topo, e os mais recentes primeiro */ 
        chamadosFiltrados.sort((a, b) => {
          if (a.statusChamado === "Pendente" && b.statusChamado !== "Pendente") return -1;
          if (a.statusChamado !== "Pendente" && b.statusChamado === "Pendente") return 1;
          return Number(b.id) - Number(a.id);
        });

        /** Envia os dados filtrados e organizados para construir as linhas na tela */
        preencherTabelaCliente(chamadosFiltrados);
      })
      .withFailureHandler(function(err) {
        console.error("Erro ao puxar registros do cliente:", err);
      })
      .roteadorChamado({ qualFuncao: "lerChamados" });
  }

  /** FUNÇÃO AUXILIAR QUE RENDERIZA AS LINHAS DO CLIENTE COM OS ESTILOS DO SISTEMA */
  function preencherTabelaCliente(dados) {
    const tbody = document.getElementById("tabela-chamados-cliente-body"); 
    if (!tbody) return;
    tbody.innerHTML = "";

    if (dados.length === 0) { 
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 24px; color:var(--text-color-faded);">Você ainda não possui nenhum chamado registrado.</td></tr>`; 
      return; 
    }

    dados.forEach(item => {
      const tr = document.createElement("tr"); 
      tr.style.borderBottom = "1px solid var(--cor-linhas)";
      
      let corBg = item.statusChamado === 'Concluído' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(245, 158, 11, 0.1)';
      let corTexto = item.statusChamado === 'Concluído' ? 'var(--cor-acaopositiva)' : 'var(--cor-pendente)';

      tr.innerHTML = `
        <td style="padding: 12px 16px; font-family: monospace; color: var(--cor-primaria); font-weight:600;">#${item.id}</td>
        <td style="padding: 12px 16px;">${item.tipoDoChamado || "Requisição"}</td>
        <td style="padding: 12px 16px; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${item.descricao || ''}">${item.descricao || ""}</td>
        <td style="padding: 12px 16px;">${item.data || ""}</td>
        <td style="padding: 12px 16px;">${item.hora || ""}</td>
        <td style="padding: 12px 16px;">
          <span style="padding: 3px 8px; border-radius: 4px; font-size:11px; font-weight:600; background-color:${corBg}; color:${corTexto};">
            ${item.statusChamado || "Pendente"}
          </span>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  /** RESTRICAO TOTAL DE ACESSO DO PORTAL DO CLIENTE */ 
  function configurarPermissoes(nivel) {
    const botoesMenu = document.querySelectorAll(".menu-navegação");
    const areasConteudo = document.querySelectorAll(".form-area");
    const nivelAcesso = String(nivel).toLowerCase().trim();

    botoesMenu.forEach(btn => btn.style.display = '');

    if (nivelAcesso === 'cliente') {
      /** Oculta completamente botões restritos do painel lateral */ 
      botoesMenu.forEach(btn => {
        if (btn.dataset.alvo !== 'chamados') {
          btn.style.setProperty('display', 'none', 'important');
        }
      });

      /** Remove o foco visual de qualquer outra aba administrativa ativa em background */ 
      areasConteudo.forEach(aba => {
        if (aba.id !== 'chamados') {
          aba.classList.remove("conteudo-ativo");
        }
      });
    }
  
    if (document.getElementById('displayNivel')) {
      document.getElementById('displayNivel').innerText = nivelAcesso.toUpperCase();
    }
  }

  /**FUNÇÃO RESPOSAVEL POR FAZER O LOGOUT DO USUARIO */
  function fazerLogout() {
    var url = 'https://script.google.com/macros/s/AKfycbzpvi0bv16fmhB2dyL9lDJMNIpVhkZ7nhBZRxHENhKhDD2KLM8bZiYiqMTnyINIc4AM/exec';
    window.top.location.href = url;
  }

  /** MÓDULO DE MÉTRICAS */
  function inicializaPainel() {
    const inputData = document.getElementById("data-inicial");
    if (!inputData) return;

    flatpickr("#data-inicial", {
      mode: "range",
      dateFormat: "d/m/Y"
    });

    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, '0');
    const dia = String(hoje.getDate()).padStart(2, '0');
    const dataPadrao = `${ano}-${mes}-${dia}`;
    
    const dados = {
      qualFuncao: "metricas",
      dataInicial: dataPadrao,
      dataFinal: dataPadrao
    };

    if (document.getElementById("total-chamados")) document.getElementById("total-chamados").textContent = "...";
    if (document.getElementById("nome-solicitante")) document.getElementById("nome-solicitante").textContent = "...";
    if (document.getElementById("nome-tipo")) document.getElementById("nome-tipo").textContent = "...";

    google.script.run.withSuccessHandler(exibeMetricas).roteadorChamado(dados);
  }

  /** FUNÇÃO QUE ATUALIZA METRICAS DO PAINEL DE METRICAS */
  function exibeMetricas(resposta) {
    if (resposta && resposta.status === "erro") {
      mostrarAlerta(resposta.mensagem);
      return;
    }

    const elementoTotal = document.getElementById("total-chamados");
    if (!elementoTotal) return;

    const elementoPeriodo = document.getElementById("periodo-selecionado");
    const elementoPorcentagem = document.getElementById("porcentagem-chamados");
    const progressRingBarTotal = document.querySelector(".card1:nth-child(1) .progress-ring-bar");

    elementoTotal.textContent = resposta.total !== undefined ? resposta.total : 0;
    
    const dataInicialFormatada = formataDataParaExibicao(resposta.periodoInicial);
    const dataFinalFormatada = formataDataParaExibicao(resposta.periodoFinal);
    if (elementoPeriodo) elementoPeriodo.textContent = `${dataInicialFormatada} a ${dataFinalFormatada}`;
    
    const porcentagemTotal = parseFloat(resposta.porcentagem) || 0;
    if (elementoPorcentagem) elementoPorcentagem.textContent = `${porcentagemTotal.toFixed(1)}%`;
    if (progressRingBarTotal) progressRingBarTotal.style.setProperty('--percentage-total', porcentagemTotal);

    const elementoNomeSolicitante = document.getElementById("nome-solicitante");
    const elementoChamadosSolicitante = document.getElementById("chamados-solicitante");
    const elementoPorcentagemSolicitante = document.getElementById("porcentagem-solicitante");
    const progressRingBarSolicitante = document.querySelector(".card1:nth-child(2) .progress-ring-bar-solicitante");

    if (resposta.solicitanteMaisAtivo && resposta.chamadosDoMaisAtivo > 0) {
      if (elementoNomeSolicitante) elementoNomeSolicitante.textContent = resposta.solicitanteMaisAtivo;
      if (elementoChamadosSolicitante) elementoChamadosSolicitante.textContent = `${resposta.chamadosDoMaisAtivo} chamado(s)`;
      
      const porcentagemDoSolicitante = parseFloat(resposta.porcentagemSolicitante) || 0;
      if (elementoPorcentagemSolicitante) elementoPorcentagemSolicitante.textContent = `${porcentagemDoSolicitante.toFixed(1)}%`;
      if (progressRingBarSolicitante) progressRingBarSolicitante.style.setProperty('--percentage-solicitante', porcentagemDoSolicitante);
    } else {
      if (elementoNomeSolicitante) elementoNomeSolicitante.textContent = "N/A";
      if (elementoChamadosSolicitante) elementoChamadosSolicitante.textContent = "Nenhum chamado";
      if (elementoPorcentagemSolicitante) elementoPorcentagemSolicitante.textContent = "0%";
      if (progressRingBarSolicitante) progressRingBarSolicitante.style.setProperty('--percentage-solicitante', 0);
    }
    
    const elementoNomeTipo = document.getElementById("nome-tipo");
    const elementoChamadosDoTipo = document.getElementById("chamados-do-tipo");
    const elementoPorcentagemTipo = document.getElementById("porcentagem-tipo");
    const progressRingBarTipo = document.querySelector(".card1:nth-child(3) .progress-ring-bar-tipo");

    if (resposta.tipoMaisAtivo && resposta.chamadosDoTipoMaisAtivo > 0) {
      if (elementoNomeTipo) elementoNomeTipo.textContent = resposta.tipoMaisAtivo;
      if (elementoChamadosDoTipo) elementoChamadosDoTipo.textContent = `${resposta.chamadosDoTipoMaisAtivo} chamado(s)`;
      
      const porcentagemDoTipo = parseFloat(resposta.porcentagemTipo) || 0;
      if (elementoPorcentagemTipo) elementoPorcentagemTipo.textContent = `${porcentagemDoTipo.toFixed(1)}%`;
      if (progressRingBarTipo) progressRingBarTipo.style.setProperty('--percentage-tipo', porcentagemDoTipo);
    } else {
      if (elementoNomeTipo) elementoNomeTipo.textContent = "N/A";
      if (elementoChamadosDoTipo) elementoChamadosDoTipo.textContent = "Nenhum chamado";
      if (elementoPorcentagemTipo) elementoPorcentagemTipo.textContent = "0%";
      if (progressRingBarTipo) progressRingBarTipo.style.setProperty('--percentage-tipo', 0);
    }
  }

  /** FUNÇÃO QUE FORMATA A DATA PRA EXIBIÇÃO */
  function formataDataParaExibicao(dataString) {
    if(!dataString || !dataString.includes("-")) return "---";
    const partes = dataString.split("-");
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  /** FUNÇÃO ENVIA DATAS */
  function enviaDatas() {
    const dataInicialInput = document.getElementById("data-inicial").value;
    if (!dataInicialInput) { mostrarAlerta("Por favor, selecione um intervalo de datas."); return; }
    
    const delimitador = dataInicialInput.includes(" to ") ? " to " : " a ";
    const datasArray = dataInicialInput.split(delimitador);
    const dataInicialFormatada = converteData(datasArray[0]);
    const dataFinalFormatada = datasArray[1] ? converteData(datasArray[1]) : dataInicialFormatada;

    mostrarLoading();
    google.script.run
        .withSuccessHandler(function(resposta) { esconderLoading(); exibeMetricas(resposta); }) 
        .roteadorChamado({ qualFuncao: "metricas", dataInicial: dataInicialFormatada, dataFinal: dataFinalFormatada });
  }

  function converteData(dataValor) {
    const partes = dataValor.trim().split("/");
    return `${partes[2]}-${partes[1]}-${partes[0]}`;
  }

  /** MÓDULO DE INTERAÇÃO DA TELA DE PESQUISA (ADMIN) */
  function pesquisarChamadoPorId() {
    const inputBusca = document.getElementById('buscarIdChamado');
    const idBusca = inputBusca ? inputBusca.value.trim() : "";
    
    if (!idBusca) {
      mostrarAlerta("Por favor, informe um ID válido para pesquisar.");
      return;
    }
    
    mostrarLoading();
    
    google.script.run
      .withSuccessHandler(function(resposta) {
        esconderLoading();
        
        if (resposta.status === "erro") {
          mostrarAlerta(resposta.mensagem);
          limparTelaPesquisa();
          return;
        }
        
        /** Alimenta os campos mapeando a nova disposição da tela */ 
        document.getElementById('editIdChamado').value = resposta.id || "";
        document.getElementById('editTipoChamado').value = resposta.tipoDoChamado || "";
        document.getElementById('editStatusChamado').value = resposta.statusChamado || "";
        document.getElementById('editFuncaoChamado').value = resposta.funcao || "";
        document.getElementById('editDataChamado').value = resposta.data || "";
        document.getElementById('editHoraChamado').value = resposta.hora || "";
        document.getElementById('editDescricao').value = resposta.descricao || "";
        
        // Informação extra inserida no input pequeno de cima
        document.getElementById('editInformacaoExtra').value = resposta.informacaoExtra || "---";
        
        // Novos campos das colunas J e K
        document.getElementById('editRepeticaoChamado').value = resposta.tipoRepeticao || "---";
        document.getElementById('editComandoChamado').value = resposta.comando || "";
        
        /** Reconstrói a chave combinada para o seletor de Solicitante */
        let solicitanteLimpo = resposta.solicitante ? String(resposta.solicitante).trim() : "";
        let funcaoLimpa = resposta.funcao ? String(resposta.funcao).trim() : "";
        const selectPesquisa = document.getElementById('editSolicitante');
        
        if (selectPesquisa) {
          if (solicitanteLimpo && funcaoLimpa && !solicitanteLimpo.includes(" - ")) {
            let valorChave = solicitanteLimpo + ' - ' + funcaoLimpa;
            selectPesquisa.value = valorChave;
            
            if (selectPesquisa.value !== valorChave) {
              let optNova = document.createElement('option');
              optNova.value = valorChave; 
              optNova.textContent = valorChave;
              selectPesquisa.appendChild(optNova);
              selectPesquisa.value = valorChave;
            }
          } else {
            selectPesquisa.value = solicitanteLimpo;
          }
        }
        
        /** CORREÇÃO DOS BLOQUEIOS: Infromação Extra NÃO destrava, Comando Destrava! */
        const camposParaDestravar = [
          'editTipoChamado', 
          'editStatusChamado', 
          'editSolicitante', 
          'editDescricao', 
          'editComandoChamado' // O Textarea grande de comando técnico fica 100% editável
        ];
        
        camposParaDestravar.forEach(idCampo => {
          const elemento = document.getElementById(idCampo);
          if (elemento) elemento.disabled = false; 
        });
        
        const formPesquisa = document.querySelector('.id-search-form');
        if (formPesquisa) formPesquisa.classList.add('form-loaded');
      })
      .withFailureHandler(function(erro) {
         esconderLoading();
         mostrarAlerta("Falha de comunicação: " + erro.message);
         limparTelaPesquisa();
      })
      .roteadorChamado({ 
        qualFuncao: "buscarUnicoChamado", 
        idChamado: idBusca 
      });
  }

  /** FUNÇÃO QUE ENVIA CHAMADOS EDITADOS */

  function salvarEdicaoChamado() {
    const solicitanteSelect = document.getElementById('editSolicitante');
    const nomefuncaoCompleto = solicitanteSelect ? solicitanteSelect.value : '';
    const [nome, funcao] = nomefuncaoCompleto.split(' - ');

    const dados = {
      qualFuncao: "entradaDeInformacoes",
      idDoChamado: document.getElementById('editIdChamado').value,
      tipoDoChamado: document.getElementById('editTipoChamado').value,
      solicitante: nome, 
      funcao: funcao,
      statusChamado: document.getElementById('editStatusChamado').value,
      descricao: document.getElementById('editDescricao').value,
      informacaoExtra: document.getElementById('editInformacaoExtra').value,
      
      // Preserva/Atualiza as novas colunas estruturadas no salvamento
      tipoRepeticao: document.getElementById('editRepeticaoChamado').value,
      comando: document.getElementById('editComandoChamado').value
    };

    if (!dados.solicitante) { mostrarAlerta("O campo Solicitante é obrigatório para salvar."); return; }

    mostrarLoading();
    google.script.run
      .withSuccessHandler(function(resposta) { 
        esconderLoading();
        mostrarAlerta(resposta); 
        limparTelaPesquisa(); 
        lerDadosDaTabela(); 
        atualizarBadgeNotificacao(); 
      })
      .roteadorChamado(dados);
  }

  /** FUNÇÃO QUE LIMPA TELAS DE PESQUISA */
  function limparTelaPesquisa() {
    const campos = [
      'buscarIdChamado', 'editIdChamado', 'editTipoChamado', 'editSolicitante',
      'editStatusChamado', 'editFuncaoChamado', 'editDataChamado', 
      'editHoraChamado', 'editDescricao', 'editInformacaoExtra',
      'editRepeticaoChamado', 'editComandoChamado'
    ];
    
    campos.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    
    /** Bloqueia novamente os campos no reset de segurança */ 
    const camposParaBloquear = [
      'editTipoChamado', 'editStatusChamado', 'editSolicitante', 
      'editDescricao', 'editInformacaoExtra', 'editComandoChamado'
    ];
    
    camposParaBloquear.forEach(idCampo => {
      const elemento = document.getElementById(idCampo);

  /** FUNÇÃO QUE LER OS DADOS DA TABELA CHAMADOS */  
  function lerDadosDaTabela() {
    if (!document.getElementById("tabela-chamados-body")) return;
    google.script.run
      .withSuccessHandler(function (resposta) {
        if (Array.isArray(resposta)) {
          resposta.sort((a, b) => {
            if (a.statusChamado === "Pendente" && b.statusChamado !== "Pendente") return -1;
            if (a.statusChamado !== "Pendente" && b.statusChamado === "Pendente") return 1;
            return Number(b.id) - Number(a.id);
          });
        }
        preencherTabelaNativaChamados(resposta);
      })
      .roteadorChamado({ qualFuncao: "lerChamados" });
  }

        <td>${item.hora || ""}</td>

      tr.addEventListener("click", function() {
        const data = JSON.parse(this.dataset.chamadoRaw);
        document.getElementById('idDoChamado').value = data.id;
        document.getElementById('tipoDoChamado').value = data.tipoDoChamado || "";
        document.getElementById('statusChamado').value = data.statusChamado || "";
        document.getElementById('descricao').value = data.descricao || "";
        document.getElementById('informacaoExtra').value = data.informacaoExtra || "";
        
        let solicitanteLimpo = data.solicitante ? String(data.solicitante).trim() : "";
        let funcaoLimpa = data.funcao ? String(data.funcao).trim() : "";
        const selectSolicitante = document.getElementById('solicitante');
        
        if (selectSolicitante) {
          if (solicitanteLimpo && funcaoLimpa && !solicitanteLimpo.includes(" - ")) {
            let valorCombinado = solicitanteLimpo + ' - ' + funcaoLimpa;
            selectSolicitante.value = valorCombinado;
            
            if (selectSolicitante.value !== valorCombinado) {
              let opt = document.createElement('option');
              opt.value = valorCombinado; 
              opt.textContent = valorCombinado;
              selectSolicitante.appendChild(opt);
              selectSolicitante.value = valorCombinado;

          } else {
            selectSolicitante.value = solicitanteLimpo;
          }
        }
        
        document.getElementById('botaochamado').innerHTML = '<i class="bi bi-pencil-square"></i> Alterar Chamado';
      });

      tbody.appendChild(tr);
    });
  }

  /** MÓDULO DE CADASTRO E GERENCIAMENTO DE USUÁRIOS */
  function verificarPermissaoSenha() {
    try {
      const permissao = document.getElementById("userPermissao").value;
      const containerSenha = document.getElementById("containerSenhaUsuario");
      const inputSenha = document.getElementById("userSenha");
      
      if (permissao === "admin" || permissao === "cliente") {
        if (containerSenha) containerSenha.style.display = ""; 
        if (inputSenha) inputSenha.required = true;
      } else {
        if (containerSenha) containerSenha.style.display = "none";
        if (inputSenha) { 
          inputSenha.value = ""; 
          inputSenha.required = false; 
        }
      }
    } catch(e) {
      console.error("Erro na validação do campo de senha:", e);
    }

  window.preencherTabelaNativaTarefas = function(dados) {

    if (!Array.isArray(dados) || dados.length === 0) {

          rotinaNome = partes[0];

          descricaoReal = partes[1];

      const btnSim = document.getElementById("confirmModalBtnSim");

          <div class="placeholder-view" style="grid-column: 1/-1;">
            <i class="bi bi-calendar-x"></i>Nenhum chamado de rotina "Abertura" foi gerado para a data de hoje.
          </div>`;
      } else {
        cacheRotinaAtual = resultado;
        renderizarCardRotina(container, resultado, "Hoje");
      }

      // Carrega automaticamente o histórico das últimas 5 rotinas
      carregarHistoricoRotinas();
    })
    .roteadorChamado({ qualFuncao: "consultarStatusRotina", nomeRotina: "Abertura" });
}

function carregarHistoricoRotinas() {
  const containerHist = document.getElementById("container-historico-rotinas");
  const btnRestaurar = document.getElementById("btnRestaurarHistorico");
  const tituloHist = document.getElementById("titulo-secao-historico");
  
  if (!containerHist) return;
  
  if (btnRestaurar) btnRestaurar.style.display = "none";
  if (tituloHist) tituloHist.textContent = "Últimas 5 Rotinas Anteriores";
  containerHist.innerHTML = `<p style="color: var(--text-color-faded); padding: 12px;">Carregando histórico anterior...</p>`;

  google.script.run
    .withSuccessHandler(function(resposta) {
      containerHist.innerHTML = "";
      cacheHistoricoRotinasMap = {};

      if (!resposta.historico || resposta.historico.length === 0) {
        containerHist.innerHTML = `
          <div class="placeholder-view" style="grid-column: 1/-1; padding: 20px;">
            <i class="bi bi-clock-history"></i>Nenhum histórico de rotinas anteriores localizado.
          </div>`;
        return;
      }

      resposta.historico.forEach(rotina => {
        cacheHistoricoRotinasMap[rotina.data] = rotina;
        renderizarCardRotina(containerHist, rotina, rotina.data);
      });
    })
    .roteadorChamado({ qualFuncao: "consultarHistoricoRotinas", nomeRotina: "Abertura" });
}

function buscarRotinaPorData() {
  const inputData = document.getElementById("inputDataBuscaRotina");
  const dataValor = inputData ? inputData.value : "";

  if (!dataValor) {
    if (typeof mostrarAlerta === "function") mostrarAlerta("Por favor, escolha uma data para pesquisar.");
    return;
  }

  // Converte AAAA-MM-DD para DD/MM/AAAA
  const partes = dataValor.split("-");
  const dataFormatadaBR = `${partes[2]}/${partes[1]}/${partes[0]}`;

  const containerHist = document.getElementById("container-historico-rotinas");
  const btnRestaurar = document.getElementById("btnRestaurarHistorico");
  const tituloHist = document.getElementById("titulo-secao-historico");

  if (!containerHist) return;

  mostrarLoading();

  google.script.run
    .withSuccessHandler(function(resposta) {
      esconderLoading();
      containerHist.innerHTML = "";

      if (btnRestaurar) btnRestaurar.style.display = "inline-block";
      if (tituloHist) tituloHist.textContent = `Resultado da pesquisa: ${dataFormatadaBR}`;

      if (!resposta.buscaResultado || !resposta.buscaResultado.encontrado) {
        containerHist.innerHTML = `
          <div class="placeholder-view" style="grid-column: 1/-1; padding: 20px;">
            <i class="bi bi-search"></i>Nenhuma rotina registrada para a data ${dataFormatadaBR}.
          </div>`;
        return;
      }

      const rotina = resposta.buscaResultado;
      cacheHistoricoRotinasMap[rotina.data] = rotina;
      renderizarCardRotina(containerHist, rotina, rotina.data);
    })
    .withFailureHandler(function(erro) {
      esconderLoading();
      if (typeof mostrarAlerta === "function") mostrarAlerta("Erro ao pesquisar: " + erro.message);
    })
    .roteadorChamado({ qualFuncao: "consultarHistoricoRotinas", nomeRotina: "Abertura", dataBusca: dataFormatadaBR });
}

function renderizarCardRotina(container, resultado, rotuloData) {
  let corBg = resultado.statusGeral === "Pendente" ? "rgba(245, 158, 11, 0.1)" : "rgba(16, 185, 129, 0.1)";
  let corTexto = resultado.statusGeral === "Pendente" ? "var(--cor-pendente)" : "var(--cor-acaopositiva)";

  const card = document.createElement("div");
  card.className = "card1";
  card.style.height = "auto";
  card.style.flexDirection = "column";
  card.style.alignItems = "flex-start";
  card.style.gap = "12px";

  card.innerHTML = `
    <div style="display:flex; justify-content:space-between; width:100%; align-items:center; border-bottom:1px solid var(--cor-linhas); padding-bottom:6px;">
      <span style="font-family:monospace; color:var(--cor-primaria); font-weight:600; text-transform:uppercase;">${resultado.nomeRotina}</span>
      <span style="padding: 2px 8px; border-radius:4px; font-size:11px; font-weight:600; background-color:${corBg}; color:${corTexto};">${resultado.statusGeral}</span>
    </div>
    <div style="width:100%;">
      <p style="margin:0; font-size:14px; font-weight:700; color:white;">Rotina de ${resultado.nomeRotina}</p>
      <p style="margin:4px 0 0 0; font-size:12px; color:var(--text-color-faded);">📅 Data: <strong>${resultado.data}</strong></p>
    </div>
    <div style="width:100%; margin-top:4px;">
      <button type="button" class="butons-bot" onclick="abrirModalDetalhesRotinaObjeto('${resultado.data}')" style="height:32px; font-size:12px; width:100%; justify-content:center;">
        <i class="bi bi-eye"></i> Ver mais
      </button>
    </div>
  `;
  container.appendChild(card);
}

function abrirModalDetalhesRotinaObjeto(dataChave) {
  let rotinaAlvo = cacheHistoricoRotinasMap[dataChave] || (cacheRotinaAtual && cacheRotinaAtual.data === dataChave ? cacheRotinaAtual : null);
  if (!rotinaAlvo) return;

  // Atualiza o cache global ativo para o gerador de PDF imprimir a rotina selecionada
  cacheRotinaAtual = rotinaAlvo;

  document.getElementById("mdRotinaSolicitante").textContent = rotinaAlvo.solicitante || "Não informado";
  document.getElementById("mdRotinaData").textContent = rotinaAlvo.data;

  const tbody = document.getElementById("mdRotinaTabelaBody");
  tbody.innerHTML = "";

  rotinaAlvo.tarefas.forEach(task => {
    const tr = document.createElement("tr");
    tr.style.borderBottom = "1px solid var(--cor-linhas)";

    let corTextoStatus = task.status === "Concluído" ? "var(--cor-acaopositiva)" : "var(--cor-pendente)";

    tr.innerHTML = `
      <td style="padding: 10px; color: white; white-space: normal; word-break: break-word;">${task.descricao}</td>
      <td style="padding: 10px;">
        <span style="padding: 2px 6px; border-radius: 4px; font-size: 11px; background-color: rgba(139, 92, 246, 0.1); color: var(--cor-primaria);">
          ${task.quando}
        </span>
      </td>
      <td style="padding: 10px; color: var(--text-color-faded); font-style: italic; white-space: normal; word-break: break-word;">${task.comando}</td>
      <td style="padding: 10px; font-weight: 600; color: ${corTextoStatus};">${task.status}</td>
    `;
    tbody.appendChild(tr);
  });

  const modal = document.getElementById("modalDetalhesRotina");
  if (modal) { modal.style.display = "flex"; modal.classList.add("modal-open"); }
}

function abrirModalDetalhesRotina() {
  if (cacheRotinaAtual && cacheRotinaAtual.data) {
    abrirModalDetalhesRotinaObjeto(cacheRotinaAtual.data);
  }
}

function fecharModalDetalhesRotina() {
  const modal = document.getElementById("modalDetalhesRotina");
  if (modal) { modal.style.display = "none"; modal.classList.remove("modal-open"); }
}



 /**  GERADOR DE PDF / IMPRESSÃO VIA ESTRUTURA HTML DIRETA */

function gerarPdfChecklistRotina() {
  if (!cacheRotinaAtual || !cacheRotinaAtual.tarefas) {
    if (typeof mostrarAlerta === "function") mostrarAlerta("Nenhum dado encontrado para gerar o PDF.");
    return;
  }

  var operadoresTexto = cacheRotinaAtual.solicitante || "Não informado";
  if (Array.isArray(cacheRotinaAtual.operadores) && cacheRotinaAtual.operadores.length > 0) {
    operadoresTexto = cacheRotinaAtual.operadores.join(" / ");
  }

  // Preenche os metadados do cabeçalho no HTML
  document.getElementById("print-rotina-nome").textContent = "Rotina: " + (cacheRotinaAtual.nomeRotina || 'Abertura');
  document.getElementById("print-meta-data").textContent = cacheRotinaAtual.data || '';
  document.getElementById("print-meta-operadores").textContent = operadoresTexto;

  // Monta as linhas da tabela com a regra OK / NÃO
  var tbody = document.getElementById("print-tabela-body");
  tbody.innerHTML = "";

  cacheRotinaAtual.tarefas.forEach(function(t) {
    var statusOk = "";
    var statusNao = "";

    if (String(t.status).toLowerCase() === "concluído" || String(t.status).toLowerCase() === "concluido") {
      statusOk = "<b style='color:#10b981;'>OK</b>";
    } else {
      statusNao = "<b style='color:#ef4444;'>NÃO</b>";
    }

    var tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="text-align: left;">${t.descricao || "---"}</td>
      <td style="text-align: center;">${t.quando || "Diariamente"}</td>
      <td style="text-align: left;">${t.comando || "---"}</td>
      <td style="text-align: center;">${statusOk}</td>
      <td style="text-align: center;">${statusNao}</td>
    `;
    tbody.appendChild(tr);
  });

  // Dispara a impressão nativa utilizando o layout formatado com a logo Base64 do HTML
  window.print();
}
</script>
